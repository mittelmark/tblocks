<?xml version="1.0" encoding="ISO-8859-1"?>
 <svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
  @import url(https://fonts.bunny.net/css?family=andika:400,400i,700,700i|ubuntu-mono:400,400i,700,700i);
  .header {
      font-family: 'Andika', sans-serif;
      font-size: 28px;
      fill: #000000;
  }
  .normal {
      font-family: 'Andika', sans-serif;
      font-size: 22px;
      fill: #333366;
  }
  .small {
      font-family: 'Andika', sans-serif;
      font-size: 16px;
      fill: #333366;
  }
  .large {
      font-family: 'Andika', sans-serif;
      font-size: 24px;
      fill: #333366;
  }
  .mono {
      font-family: 'Ubuntu Mono', monospaced;
      font-size: 22px;
      fill: #333366;
  }
  .bold {
      font-family: 'Andika', sans-serif;
      font-weight: bold;
      font-size: 22px;
      fill: #333366;
  }

  </style>
<line x1="600" y1="205" x2="600" y2="155" stroke="#FFCCCC" stroke-width="7" stroke-linecap="round" />
<line x1="730" y1="286" x2="774" y2="264" stroke="#FFCCCC" stroke-width="7" stroke-linecap="round" />
<line x1="740" y1="384" x2="788" y2="395" stroke="#FFCCCC" stroke-width="7" stroke-linecap="round" />
<line x1="459" y1="384" x2="410" y2="395" stroke="#FFCCCC" stroke-width="7" stroke-linecap="round" />
<line x1="469" y1="286" x2="424" y2="264" stroke="#FFCCCC" stroke-width="7" stroke-linecap="round" />
<circle cx="600" cy="350" r="145" fill="#E68080" stroke="#B64040" stroke-width="2" />
   <text x="600" y="63" class="header" text-anchor="middle">1.1 Privacy &amp; Data Leakage</text>
   <text x="600" y="105" class="normal" text-anchor="middle">Feeding real patient or proprietary data</text>
   <text x="600" y="135" class="normal" text-anchor="middle">into public APIs breaches</text>
   <text x="600" y="165" class="normal" text-anchor="middle">confidentiality.</text>
   <text x="930" y="178" class="header" text-anchor="middle">1.2 Foreign Code Injection</text>
   <text x="930" y="220" class="normal" text-anchor="middle">Licensing issues arising from generated</text>
   <text x="930" y="250" class="normal" text-anchor="middle">code,</text>
   <text x="930" y="280" class="normal" text-anchor="middle">requires strict auditing of output.</text>
   <text x="930" y="418" class="header" text-anchor="middle">1.3 Dependency Injection</text>
   <text x="930" y="460" class="normal" text-anchor="middle">AI models frequently introduce</text>
   <text x="930" y="490" class="normal" text-anchor="middle">unnecessary libraries,</text>
   <text x="930" y="520" class="normal" text-anchor="middle">complicating simple statistical</text>
   <text x="930" y="550" class="normal" text-anchor="middle">pipelines.</text>
   <text x="270" y="418" class="header" text-anchor="middle">1.4 Non-Deterministic</text>
   <text x="270" y="452" class="header" text-anchor="middle">Behavior</text>
   <text x="270" y="494" class="normal" text-anchor="middle">The exact same input prompt may yield</text>
   <text x="270" y="524" class="normal" text-anchor="middle">varying</text>
   <text x="270" y="554" class="normal" text-anchor="middle">statistical methodologies or code</text>
   <text x="270" y="584" class="normal" text-anchor="middle">structures.</text>
   <text x="270" y="178" class="header" text-anchor="middle">1.5 Hallucinations</text>
   <text x="270" y="220" class="normal" text-anchor="middle">Models confidently fabricating</text>
   <text x="270" y="250" class="normal" text-anchor="middle">mathematical</text>
   <text x="270" y="280" class="normal" text-anchor="middle">justifications or phantom functions.</text>
   <text x="600" y="333" class="header" text-anchor="middle">1. LLM Traps</text>
   <text x="600" y="367" class="header" text-anchor="middle">&amp; Risks</text>
</svg>
